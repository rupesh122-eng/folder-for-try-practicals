<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            background-color: none;
            background-image: url(https://png.pngtree.com/thumb_back/fw800/background/20240119/pngtree-empty-wooden-table-platform-and-bokeh-at-night-image_15612733.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            form {
                border: none;
            }
        }

        input[type=text],
        input[type=password] {
            border: none;
            color: whitesmoke;
            border-bottom: 2px solid #ccc;
            background-color: transparent;
            width: 100%;
            padding: 12px 10px;
            margin: 8px 0;
            display: inline-block;
            border: none solid #ccc;
            box-sizing: border-box;
        }

        button {
            background-color: #180459;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            width: 45%;
            display: block;
            margin-left: auto;
            font-size: 14px;
            border-radius: 5px;
            
        }

        .card {
            max-width: 800px;
            margin: auto;
            color: none;
            margin-top: 100px;
            border: none;
            border-radius: 20px;
            padding: auto;
            background-color: transparent;
            box-shadow: 0 8px 10px 0 rgba(0, 0, 0, 0.2);
            text-align: left;
            font-family: arial;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            border-bottom: #180459;
            backdrop-filter: blur(10px);
        }
        

        button:hover {
            opacity: 0.8;
        }

        .container {
            padding: 16px;
            border: none;
            border-bottom: none solid #ccc;
        }
        label {
            font-size: auto;
            color: #108c8d;
        }
        div {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card div {
            width: 100%;
            
        }
        h2{
            color: #3d1020;
        }
        
        
        

       
    </style>
    <div class="card">
        <div class="content">
        <div class="container">
            <div>
                <div>
                    <h2 style="text-align: center; margin: 30px;"><b>Create Account</b></h2>
                    <form action="#" method="post">
                        <label for="fname">First Name</label>
                        <input type="text" id="fname" name="firstname" placeholder="Your name..">

                        <label for="lname">Last Name</label>
                        <input type="text" id="lname" name="lastname" placeholder="Your last name..">

                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" placeholder="Your email..">

                        <label for="psw">Password</label>
                        <input type="password" id="psw" name="password" placeholder="Your password..">
                        <label for="cnfm">Confirm</label>
                        <input type="password" id="cnfm" name="confirm" placeholder="Confirm password..">
                        <p>
                            use 8 or more characters with a mix of letters, numbers & symbols.
                        </p>

                        <button type="submit">Next</button>
                    </form>
                </div>
                
            </div>
        </div>
    </div>
    
</body>
</html>
