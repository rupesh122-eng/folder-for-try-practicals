<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body{
            background-color: none;
            background-image: url(https://png.pngtree.com/thumb_back/fw800/background/20240119/pngtree-empty-wooden-table-platform-and-bokeh-at-night-image_15612733.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        form {
            border: none;
        }}

        input[type=text],
        input[type=password] {
            border: none;
            border-bottom: 2px solid #ccc;
            background-color: transparent;
            width: 100%;
            padding: 12px 10px;
            margin: 8px 0;
            display: inline-block;
            box-sizing: border-box;
            outline: none;
            color: whitesmoke;
        }

        button {
            background-color: green;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        .newaccbtn{
            background-color: transparent;
            color: white;
            padding: 5px 15px;
            margin: 8px 0;
            border: 1px solid #8c8d10;
            border-radius: 5px;
            cursor: pointer;
            width: auto;
            text-align: center;
            margin-left: auto;
            display: block;
            font-size: 14px;
        }
        
        .newaccbtn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        

        button:hover {
            opacity: 0.8;
        }

        span.psw {
            float: right;
            padding-top: auto;
        }

        img.avatar {
            width: 20%;
            border-radius: 50%;
        }

        .imgcontainer {
            text-align: center;
            margin: 24px 12px 0;
        }

        .container {
            padding: 16px;
            border: none;
            border-bottom: none solid #ccc;
        }

        .card {
            box-shadow: 0 8px 10px 0 rgba(0, 0, 0, 0.2);
            max-width: 500px;
            margin: auto;
            text-align: left;
            font-family: arial;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            border-bottom: #180459;
            background-color: transparent;
            border-radius: 15px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .content {
            padding: 20px;
        }
        label {
            font-size: auto;
            color: #108c8d;
        }
         p
        {
            color: white;
            background-color:transparent;
            text-align: left;
            font-size: auto;
        }
    </style>
    <div class="card">
        <div class="content">
            <h1 align="center"><b>Login</b></h1>
            <form action="#">
                <div card-body>
                    <div class="imgcontainer">
                        <img src="https://www.w3schools.com/howto/img_avatar2.png" alt="Avatar" class="avatar">
                    </div>

                </div>

                
                <div class="container">

                    <p align="center" style="color: #3e20b6;">Please fill in this form to create an account.</p>
                    <hr>

                    <label for="email"><b>Username</b></label>
                    <input type="text" placeholder="Enter Username" name="email" required><br><br>

                    <label for="psw"><b>Password</b></label>
                    <input type="password" placeholder="Enter Password" name="psw" required><br><br>

                    <button type="submit" class="loginbtn">Login
                    </button>
                    <label>
                        <input type="checkbox" checked="checked" name="remember"> Remember me
                    </label>
                    <span class="psw"><a href="./forgotpwd.html">Forgot Password?</a></span>
                </div>

                <div class="container" style="background-color: transparent; justify-content:space-between; margin-top: 15px;"  >
                    <button type="button" class="newaccbtn" align="right"><a href="./newacc.html">Create an Account</a></button>
                    
                    <p background-color="#f1f1f1" align="left">
                        Don't have an account? <a href="./signin.html" target="_blank" >Sign in</a>.
                    </p>
                
                </div>

        </div>

    </div>
    </form>
</body>

</html>
