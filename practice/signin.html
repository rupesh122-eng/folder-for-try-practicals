<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <style>
        body {
            background-color: none;
            background-image: url(https://png.pngtree.com/thumb_back/fw800/background/20240119/pngtree-empty-wooden-table-platform-and-bokeh-at-night-image_15612733.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            form {
                border: none;
            }
        }

        input[type=text],
        input[type=password] {
            border: none;
            border-bottom: 2px solid #ccc;
            background-color: transparent;
            width: 100%;
            padding: 12px 10px;
            margin: 8px 0;
            display: inline-block;
            border: none solid #ccc;
            box-sizing: border-box;
            outline: none;
            color: whitesmoke;
        }

        button {
            background-color: green;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3 ease;
             background: linear-gradient(80deg);
        }
        button:hover {
            background-color: #180459;
            opacity: 0.8;
            transform: translatey(-2px);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .card {
            box-sizing: border-box;
            max-width: 500px;
            margin: auto;
            margin-top: 100px;
            border: 1px solid #ccc;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 5px 9px rgba(0, 0, 0, 0.1);
            background-color: transparent;
            box-shadow: 0 8px 10px 0 rgba(0, 0, 0, 0.2);
            text-align: left;
            font-family: arial;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            border-bottom: #180459;
            background-color: rgbsa(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            
        }
        
        .newaccbtn{
            background-color: transparent;
            color: black;
            padding: 5px 15px;
            margin: 8px 0;
            border: 1px none;
            border-radius: 5px;
            cursor: pointer;
            width: auto;
            text-align: center;
            margin-left: auto;
            display: block;
            font-size: 14px;
        }
        
        .newaccbtn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .button:hover {
            opacity: 0.8;
        }

        .container {
            padding: 16px;
            border: none;
            border-bottom: none solid #ccc;
        }

        span.psw {
            float: right;
            padding-top: auto;
        }
        label
            {
                font-size: auto;
                color: rgb(199, 56, 5);
            }

        img.avatar {
            width: 20%;
            border-radius: 50%;
        }

        .imgcontainer {
            text-align: center;
            margin: 24px 12px 0;
        }
        label {
            font-size: auto;
        }
        p
        {
            color: white;
            background-color:transparent;
            text-align: left;
            font-size: auto;
        }
    </style>
    <div class="card">
        <div class="content">
            <h2><b>
                    <center>Sign in</center>
                </b></h2>
            <form action="#">
                <div class="imgcontainer">
                    <img src="https://www.w3schools.com/howto/img_avatar2.png" alt="Avatar" class="avatar">
                </div>

                <div class="container">
                    <label for="uname"><b>Username</b></label>
                    <input type="text" placeholder="Enter Username" name="uname" required>

                    <label for="psw"><b>Password</b></label>
                    <input type="password" placeholder="Enter Password" name="psw" required>
                    <button type="submit">Sign in</button>
                     <span class="psw"><a href="./forgotpwd.html">Forgot Password?</a></span>
                </div>

                <div class="container" style="background-color: transparent; margin-top: 15px;"">
                    <button type="button" class="newaccbtn" ><a href="./newacc.html" target="_blank">Create an Account</a></button>
                    <p >
                        Already have an account? <a href="./index.html">Login</a>
                    </p>

                </div>
        </div>
        </form>

    </div>
</body>

</html>
