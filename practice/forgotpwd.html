<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
</head>

<body>
    <style>
        body {
            background-color: transparent;
            background-image: url(https://png.pngtree.com/thumb_back/fw800/background/20240119/pngtree-empty-wooden-table-platform-and-bokeh-at-night-image_15612733.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        form {
            border: none;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        input[type=text] {
            border: none;
            border-bottom: 2px solid #ccc;
            background-color: transparent;
            width: 100%;
            padding: 12px 10px;
            margin: 8px 0;
            display: inline-block;
            box-sizing: border-box;
            color: whitesmoke;
        }

        button {
            background-color: green;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        .card {
            max-width: 500px;
            margin: auto;
            margin-top: 100px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 5px 9px rgba(0, 0, 0, 0.1);
            background-color: transparent;
            box-shadow: 0 8px 10px 0 rgba(0, 0, 0, 0.2);
            text-align: left;
            font-family: arial;
            display: flex;
            box-shadow: 0 8px 10px 0 rgba(0, 0, 0, 0.2);
            justify-content: center;
            align-items: center;
            border: none;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
            .container {
            padding: 16px;
            border: none;
            border-bottom: 1px solid #ccc;
        }  
        content {
            padding: 20px;
            width: 100%;
            padding-top: 0px;
        }
        p
        {
            color: rgb(169, 169, 6);
            background-color:transparent;
            text-align: left;
            font-size: auto;
        }
        label {
            font-size: auto;
            color: rgb(106, 80, 80);
        }
        
    </style>
    <div class="card">
        <div class="content">
            <div>
                <div class="container">
                <h1 align="center"><b>Forgot Password?</b></h1>
                <p align="center">Enter your email address to reset your password. We'll send you a password reset link.  </p>
                <form action="/reset-password" method="post" style="max-width: 300px; margin: auto;">
                    <input type="text" placeholder="Email Address" name="email" required><br>
                    <button type="submit">Reset Password</button>
                    <p align="center">
                        <a href="./index.html">Back to Login</a>
                    </p>
            </div>
            </div>
        </div>
        </form>
    </div>
</body>

</html>
